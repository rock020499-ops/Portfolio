<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Owner's Gate - ダッシュボード</title>
    <style>
        /* --- 全体 --- */
        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
        }
        .header {
            background-color: #2c3e50;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
            margin: 0;
        }
        .header p {
            font-size: 12px;
            margin: 3px 0 0;
            color: #bdc3c7;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .floor-map-wrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .real-plan-img {
            max-height: 280px;
            width: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .real-plan-figure {
            margin: 0;
            text-align: center;
        }
        .real-plan-figure figcaption {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        .card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 25px;
        }
        h2 {
            font-size: 18px;
            border-left: 5px solid #3498db;
            padding-left: 10px;
            margin-top: 0;
        }
        .count {
            font-size: 13px;
            color: #777;
            margin-bottom: 10px;
        }

        /* --- 部屋ボタン --- */
        .room-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }
        .room-btn {
            display: inline-block;
            padding: 6px 10px;
            background-color: #ecf0f1;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            text-decoration: none;
        }
        .room-btn.active {
            background-color: #3498db;
            color: #fff;
            border-color: #3498db;
        }

        /* --- 間取り図（部屋名で位置を指定するので座標計算がいらない） --- */
        .floor-plan {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 68px 68px 68px 34px;
            grid-template-areas:
                "r5 r8 r9 r1"
                "r7 r6 r6 r2"
                "r4 r6 r6 r3"
                "r10 r10 r10 r10";
            gap: 4px;
            max-width: 520px;
            margin-bottom: 12px;
        }
        .floor-plan a {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ecf0f1;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
            font-size: 12px;
            text-align: center;
            padding: 2px;
        }
        .floor-plan a.active {
            background-color: #3498db;
            color: #fff;
            border-color: #3498db;
        }
        .floor-plan .num {
            font-size: 13px;
            font-weight: bold;
            color: #888;
        }
        .floor-plan a.active .num {
            color: #fff;
        }
        /* 各部屋を間取りの位置に割り当て */
        .r1  { grid-area: r1; }
        .r2  { grid-area: r2; }
        .r3  { grid-area: r3; }
        .r4  { grid-area: r4; }
        .r5  { grid-area: r5; }
        .r6  { grid-area: r6; }   /* リビングは中央で2×2の広さ */
        .r7  { grid-area: r7; }
        .r8  { grid-area: r8; }
        .r9  { grid-area: r9; }
        .r10 { grid-area: r10; }  /* バルコニーは下部の横長 */

        /* --- テーブル --- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f0f0f0;
        }
        tr.done td {
            color: #aaa;
            text-decoration: line-through;
        }

        /* --- フォーム --- */
        .add-form {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
        }
        .add-form h3 {
            font-size: 14px;
            margin: 0 0 10px;
        }
        .add-form label {
            font-size: 12px;
            color: #555;
            display: block;
            margin-bottom: 2px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }
        .form-row > div {
            display: flex;
            flex-direction: column;
        }
        input, select, textarea {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 13px;
        }

        /* --- ボタン --- */
        .btn {
            padding: 5px 12px;
            border: none;
            border-radius: 3px;
            background-color: #3498db;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-gray {
            background-color: #95a5a6;
        }
        .btn-danger {
            background-color: #e74c3c;
        }
        .logout-btn {
            background: none;
            border: 1px solid #fff;
            color: #fff;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>Owner's Gate</h1>
            <p>マンション売却・家財整理ダッシュボード</p>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">ログアウト</button>
        </form>
    </div>

    <div class="container">

        <!-- ============ 部屋別 廃棄リスト ============ -->
        <div class="card">
            <h2>部屋別 業者依頼廃棄リスト</h2>

            <!-- 間取り図（部屋をクリックすると ?room=番号 でその部屋だけ表示） -->
            <p class="count">間取り図（部屋をクリックで絞り込み）</p>
            <div class="floor-map-wrapper">
                <div>
                    <div class="floor-plan">
                        <a class="r5"  th:href="@{/(room=5)}"  th:classappend="${selectedRoom == 5}  ? 'active' : ''"><span class="num">⑤</span>洋室(4)</a>
                        <a class="r8"  th:href="@{/(room=8)}"  th:classappend="${selectedRoom == 8}  ? 'active' : ''"><span class="num">⑧</span>浴室・洗面</a>
                        <a class="r9"  th:href="@{/(room=9)}"  th:classappend="${selectedRoom == 9}  ? 'active' : ''"><span class="num">⑨</span>玄関</a>
                        <a class="r1"  th:href="@{/(room=1)}"  th:classappend="${selectedRoom == 1}  ? 'active' : ''"><span class="num">①</span>洋室(1)</a>
                        <a class="r7"  th:href="@{/(room=7)}"  th:classappend="${selectedRoom == 7}  ? 'active' : ''"><span class="num">⑦</span>キッチン</a>
                        <a class="r6"  th:href="@{/(room=6)}"  th:classappend="${selectedRoom == 6}  ? 'active' : ''"><span class="num">⑥</span>リビング</a>
                        <a class="r2"  th:href="@{/(room=2)}"  th:classappend="${selectedRoom == 2}  ? 'active' : ''"><span class="num">②</span>洋室(2)</a>
                        <a class="r4"  th:href="@{/(room=4)}"  th:classappend="${selectedRoom == 4}  ? 'active' : ''"><span class="num">④</span>洋室(3)</a>
                        <a class="r3"  th:href="@{/(room=3)}"  th:classappend="${selectedRoom == 3}  ? 'active' : ''"><span class="num">③</span>和室</a>
                        <a class="r10" th:href="@{/(room=10)}" th:classappend="${selectedRoom == 10} ? 'active' : ''"><span class="num">⑩</span>バルコニー</a>
                    </div>
                    <a th:href="@{/}" class="room-btn" th:classappend="${selectedRoom == null} ? 'active' : ''">すべて表示</a>
                </div>
                <figure class="real-plan-figure">
                    <figcaption>実際の間取り図</figcaption>
                    <img src="/images/real_plan1.jpg" alt="実際の間取り図" class="real-plan-img">
                </figure>
                <figure class="real-plan-figure">
                    <figcaption>廃棄物業者に提出した資料</figcaption>
                    <img src="/images/real_plan2.jpg" alt="廃棄物業者に提出した資料" class="real-plan-img">
                </figure>
            </div>

            <p class="count">全 <span th:text="${#lists.size(wasteItems)}">0</span> 件</p>

            <table>
                <thead>
                    <tr>
                        <th>状態</th>
                        <th>部屋</th>
                        <th>アイテム</th>
                        <th>サイズ</th>
                        <th>Phase</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${wasteItems}" th:classappend="${item.isCompleted} ? 'done' : ''">
                        <td>
                            <!-- ボタンを押すと API を呼んで完了/未完了を切り替える -->
                            <button type="button" class="btn btn-gray"
                                    th:onclick="'toggleWaste(' + ${item.id} + ')'"
                                    th:text="${item.isCompleted} ? '済' : '未'">未</button>
                        </td>
                        <td th:text="'Room ' + ${item.roomNumber}">Room 1</td>
                        <td th:text="${item.itemName}">アイテム名</td>
                        <td th:text="${item.size}">大</td>
                        <td th:text="${item.phase == 1} ? '事前(P1)' : '引越時(P2)'">事前(P1)</td>
                        <td>
                            <button type="button" class="btn btn-danger"
                                    th:onclick="'deleteWaste(' + ${item.id} + ')'">削除</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(wasteItems)}">
                        <td colspan="6">アイテムがありません。</td>
                    </tr>
                </tbody>
            </table>

            <!-- アイテム追加フォーム -->
            <div class="add-form">
                <h3>アイテムを追加</h3>
                <form onsubmit="addWaste(); return false;">
                    <div class="form-row">
                        <div>
                            <label>部屋</label>
                            <select id="add-room">
                                <option value="1">1 洋室(1)</option>
                                <option value="2">2 洋室(2)</option>
                                <option value="3">3 和室</option>
                                <option value="4">4 洋室(3)</option>
                                <option value="5">5 洋室(4)</option>
                                <option value="6">6 リビング</option>
                                <option value="7">7 キッチン・ダイニング</option>
                                <option value="8">8 浴室・洗面所・トイレ</option>
                                <option value="9">9 玄関</option>
                                <option value="10">10 バルコニー</option>
                            </select>
                        </div>
                        <div>
                            <label>アイテム名</label>
                            <input type="text" id="add-name" required>
                        </div>
                        <div>
                            <label>サイズ</label>
                            <select id="add-size">
                                <option>小</option>
                                <option>中</option>
                                <option>大</option>
                                <option>特大</option>
                            </select>
                        </div>
                        <div>
                            <label>Phase</label>
                            <select id="add-phase">
                                <option value="1">事前(P1)</option>
                                <option value="2">引越時(P2)</option>
                            </select>
                        </div>
                        <div>
                            <button type="submit" class="btn">追加</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- ============ 自力処分の記録 ============ -->
        <div class="card">
            <h2>自力処分の記録</h2>
            <p class="count">全 <span th:text="${#lists.size(logs)}">0</span> 件</p>

            <table>
                <thead>
                    <tr>
                        <th>大分類</th>
                        <th>小分類</th>
                        <th>数量</th>
                        <th>日付</th>
                        <th>メモ</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${logs}" th:id="'log-row-' + ${log.id}"
                        th:data-main="${log.mainCategory}"
                        th:data-cat="${log.category}"
                        th:data-qty="${log.quantity}"
                        th:data-unit="${log.unit}"
                        th:data-date="${log.disposalDate}"
                        th:data-note="${log.note}">
                        <td th:text="${log.mainCategory}">燃えるゴミ</td>
                        <td th:text="${log.category}">生ゴミ</td>
                        <td th:text="${log.quantity} + ' ' + ${log.unit}">20 袋</td>
                        <td th:text="${log.disposalDate}">2026-04-01</td>
                        <td th:text="${log.note}"></td>
                        <td>
                            <button type="button" class="btn btn-gray"
                                    th:onclick="'editLog(' + ${log.id} + ')'"> 修正</button>
                            <button type="button" class="btn btn-danger"
                                    th:onclick="'deleteLog(' + ${log.id} + ')'">削除</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(logs)}">
                        <td colspan="6">記録がありません。</td>
                    </tr>
                </tbody>
            </table>

            <!-- 記録追加フォーム -->
            <div class="add-form">
                <h3>記録を追加</h3>
                <form onsubmit="addLog(); return false;">
                    <div class="form-row">
                        <div>
                            <label>大分類</label>
                            <select id="log-main">
                                <option>燃えるゴミ</option>
                                <option>その他不燃ゴミ</option>
                                <option>缶・ペットボトル</option>
                                <option>ビン</option>
                                <option>プラゴミ</option>
                                <option>紙資源</option>
                            </select>
                        </div>
                        <div>
                            <label>小分類</label>
                            <input type="text" id="log-cat" placeholder="例: 雑誌" required>
                        </div>
                        <div>
                            <label>数量</label>
                            <input type="number" id="log-qty" required>
                        </div>
                        <div>
                            <label>単位</label>
                            <select id="log-unit">
                                <option>袋</option>
                                <option>束</option>
                                <option>個</option>
                                <option>kg</option>
                            </select>
                        </div>
                        <div>
                            <label>日付</label>
                            <input type="date" id="log-date" required>
                        </div>
                        <div>
                            <label>メモ</label>
                            <input type="text" id="log-note">
                        </div>
                        <div>
                            <button type="submit" class="btn">記録</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        // ===== REST API を呼ぶための関数 =====
        // どれも「fetch で API を呼ぶ → 終わったらページを再読み込み」という流れ。
        // 再読み込みで、今の絞り込み（?room=番号）もそのまま保たれる。

        // 廃棄アイテムを追加（POST /api/waste-items）
        function addWaste() {
            const data = {
                roomNumber: document.getElementById('add-room').value,
                itemName:   document.getElementById('add-name').value,
                size:       document.getElementById('add-size').value,
                phase:      document.getElementById('add-phase').value
            };
            fetch('/api/waste-items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => {
                if (res.ok) {
                    location.reload();               // 成功したら画面を更新
                } else {
                    // サーバーのバリデーションで弾かれた場合、エラー内容を表示
                    res.json().then(errors => alert(Object.values(errors).join('\n')));
                }
            });
        }

        // 完了 / 未完了を切り替え（PUT /api/waste-items/{id}/toggle）
        function toggleWaste(id) {
            fetch('/api/waste-items/' + id + '/toggle', { method: 'PUT' })
                .then(() => location.reload());
        }

        // 廃棄アイテムを削除（DELETE /api/waste-items/{id}）
        function deleteWaste(id) {
            if (!confirm('削除しますか？')) return;
            fetch('/api/waste-items/' + id, { method: 'DELETE' })
                .then(() => location.reload());
        }

        // 処分の記録を追加（POST /api/logs）
        function addLog() {
            const data = {
                mainCategory: document.getElementById('log-main').value,
                category:     document.getElementById('log-cat').value,
                quantity:     document.getElementById('log-qty').value,
                unit:         document.getElementById('log-unit').value,
                disposalDate: document.getElementById('log-date').value,
                note:         document.getElementById('log-note').value
            };
            fetch('/api/logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => {
                if (res.ok) {
                    location.reload();               // 成功したら画面を更新
                } else {
                    // サーバーのバリデーションで弾かれた場合、エラー内容を表示
                    res.json().then(errors => alert(Object.values(errors).join('\n')));
                }
            });
        }

        // 処分の記録を削除（DELETE /api/logs/{id}）
        function deleteLog(id) {
            if (!confirm('削除しますか？')) return;
            fetch('/api/logs/' + id, { method: 'DELETE' })
                .then(() => location.reload());
        }

        // 処分の記録をインライン編集模式に切り替え
        function editLog(id) {
            const row = document.getElementById('log-row-' + id);
            const main = row.dataset.main;
            const cat  = row.dataset.cat;
            const qty  = row.dataset.qty;
            const unit = row.dataset.unit;
            const date = row.dataset.date;
            const note = row.dataset.note;

            const mainOpts = ['燃えるゴミ', 'その他不燃ゴミ', '缶・ペットボトル', 'ビン', 'プラゴミ', '紙資源']
                .map(c => `<option${c === main ? ' selected' : ''}>${c}</option>`).join('');
            const unitOpts = ['袋', '束', '個', 'kg']
                .map(u => `<option${u === unit ? ' selected' : ''}>${u}</option>`).join('');

            row.innerHTML = `
                <td><select id="e-main-${id}" style="font-size:12px">${mainOpts}</select></td>
                <td><input type="text" id="e-cat-${id}" value="${cat}" style="width:90px;font-size:12px"></td>
                <td style="white-space:nowrap">
                    <input type="number" id="e-qty-${id}" value="${qty}" style="width:50px;font-size:12px">
                    <select id="e-unit-${id}" style="font-size:12px">${unitOpts}</select>
                </td>
                <td><input type="date" id="e-date-${id}" value="${date}" style="font-size:12px"></td>
                <td><input type="text" id="e-note-${id}" value="${note}" style="width:380px;font-size:12px"></td>
                <td style="white-space:nowrap">
                    <button type="button" class="btn" onclick="saveLog(${id})">保存</button>
                    <button type="button" class="btn btn-gray" onclick="location.reload()">取消</button>
                </td>
            `;
        }

        // 編集内容を PUT /api/logs/{id} で保存
        function saveLog(id) {
            const data = {
                mainCategory: document.getElementById('e-main-' + id).value,
                category:     document.getElementById('e-cat-'  + id).value,
                quantity:     document.getElementById('e-qty-'  + id).value,
                unit:         document.getElementById('e-unit-' + id).value,
                disposalDate: document.getElementById('e-date-' + id).value,
                note:         document.getElementById('e-note-' + id).value
            };
            fetch('/api/logs/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => {
                if (res.ok) {
                    location.reload();
                } else {
                    res.json().then(errors => alert(Object.values(errors).join('\n')));
                }
            });
        }
    </script>

</body>
</html>
